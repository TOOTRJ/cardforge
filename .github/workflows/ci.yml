# CI — runs on every pull request and on main.
#
#   changes the classifier: which TIER this run is (see the end).
#   docs    the notes and draft tiers' test run: `npm run test:docs`.
#   checks  the required "Typecheck, lint, unit" check — a gate over three
#           jobs that run side by side:
#             static    typecheck + lint + `next build`. The build is the only
#                       thing that catches a cookie read on a
#                       `dynamic = "error"` page or an undefined Satori style
#                       value.
#             unit      the unit suite in six shards (vitest `--shard`), each
#                       on the bucket frame masters too, fetched from
#                       production's PUBLIC frames bucket
#                       (scripts/frames-fetch.mjs).
#             coverage  the shards' reports merged: the coverage floors of
#                       vitest.config.ts held on the WHOLE suite, and the
#                       `coverage` artifact.
#   frames  every object in lib/frames/frame-manifest.json is readable from
#           PRODUCTION's frames bucket (frames plan 4.2, docs/FRAMES.md) — a
#           PR that adds frames stays red until the owner runs
#           `npm run frames:promote`. Public reads only; no secrets.
#   e2e     the full Playwright suite against a LOCAL Supabase stack booted
#           inside the runner (never the dev branch, never production). This is
#           the job that would have caught the 12 specs that drifted — and the
#           two real bugs hiding behind them — in 2026-09.
#   visual  the renderer's pixels (TODO 7.1): every case of
#           tests/visual/matrix.ts (every frame template × colour × a few
#           content shapes, finishes, HD, print corners) baked through the real
#           Satori bake in three parallel jobs, then gated against the hashes in
#           tests/visual/baseline.json. A changed hash fails unless the PR
#           bumped CARD_LAYOUT_VERSION — and then until the regenerated
#           baseline is committed (the summary lists the changed cases and the
#           regenerate command; the `visual-baseline` artifact is this run's).
#           New, removed or redefined cases (a matrix edit) and print-only
#           (square-corner) changes need only the regenerated baseline.
#           Frames are fetched from the public bucket by manifest sha and
#           cached by the manifest's hash — never committed.
#   parity  the BROWSER preview held to the bake (TODO 3.11): the cards of
#           tests/parity/cases.ts drawn by components/cards/card-preview.tsx
#           in headless Chromium (its own `next dev`, no database) and by the
#           Satori bake, compared region by region at 750 px and HD against
#           tests/parity/thresholds.ts and the recorded offsets in
#           tests/parity/baseline/<platform>/ (one file per case). The
#           summary has the measured table; a red run prints the linux case
#           files an update would write as a script to paste (the same
#           files are the `parity-baseline` artifact), and its
#           `parity-differences` artifact holds the preview / bake /
#           difference pictures.
#
# TIERS (owner 2026-10-13 — Actions minutes are billed once the repo is
# private, and the full run is ~65 of them). `changes` picks one per run
# (scripts/lib/ci-docs-only.mjs) and says which, and why, on the run summary:
#
#   full   everything above. A READY pull request; a merge to main that the
#          pull request's own run did not already test; anything unclear.
#   notes  every changed file is notes (the allow-list: root *.md,
#          docs/**/*.md, .claude/**/*.md, the two tests READMEs): `docs` only.
#   draft  a DRAFT pull request: `static` + `docs`. Marking it ready starts
#          the full run on the same head. Its gate reports as "Draft checks"
#          — never under the required name (see `checks`).
#   light  a merge to main whose tree is the pull request head's own tree
#          (the branch held all of main) and that leaves the frame manifest
#          alone: `static` + `unit` + `coverage`. e2e, visual, parity and
#          frames ran on these exact files in the pull request.
#
# Keep a new heavy job behind the `changes` condition, never behind a
# workflow-level `paths-ignore`. No secrets are needed: the local stack's
# keys are generated per run and the e2e user is throwaway.
name: CI

on:
  # `ready_for_review` is what starts the FULL run when a draft is marked
  # ready (same head, no push). `converted_to_draft` is left out on purpose:
  # the head keeps the results of the run it had — they are true of that
  # commit — and the next push to the draft runs the draft tier.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A pull request: one run per pull request, a newer push (or "ready for
# review") cancels the one in flight. main: one group per COMMIT, so no merge
# ever cancels or queues behind another — each merge's run finishes. (With one
# group for main a second merge cancelled the first one's run; that was sound
# only while every main run was a full one. A notes or light run says nothing
# about the merge before it.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which tier is this run (owner 2026-10-13; the header's TIERS)? The script
  # writes the tier and the job groups it runs — `static`, `unit`, `heavy`,
  # `docs`, each "true" or "false" — and every job below reads its group.
  # Anything unclear is the FULL tier: an unreadable diff, an unknown event,
  # a merge to main whose tree the pull request did not test.
  # Never a workflow-level `paths-ignore`: a workflow that does not start
  # leaves its required checks "Waiting for status to be reported" and the
  # pull request cannot merge. A job skipped by its own `if` reports
  # "skipped", which a required check accepts.
  # Every job that a tier may skip is `!cancelled() && … != 'false'`: when
  # this job FAILS its outputs are empty and they all run (without a status
  # function a failed need would skip them — and a skipped required check
  # passes).
  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      static: ${{ steps.classify.outputs.static }}
      unit: ${{ steps.classify.outputs.unit }}
      heavy: ${{ steps.classify.outputs.heavy }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      # Depth 2: HEAD is a merge commit (a pull request's test merge, or the
      # merge on main) and HEAD^1 what it was merged into — their diff is
      # what merging changes. On main the script deepens the clone itself
      # (commits and trees only) to ask whether the branch held all of main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The runner's own Node: the script imports nothing but node: modules.
      - name: Classify
        id: classify
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: node scripts/ci-classify-change.mjs

  # The notes and draft tiers' tests: the unit tests that read a notes file
  # (`npm run test:docs` — docs/FRAMES.md and CLAUDE.md's section titles,
  # TODO.md's item numbers), which a notes-only pull request can break. No
  # coverage (the floors are the whole suite's), no bucket masters (their
  # checks report "unavailable": notes move no master).
  # tests/unit/devops/ci-docs-only.test.ts fails when a test that reads
  # Markdown is missing from the script.
  docs:
    name: Notes checks
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:docs

  # Typecheck, lint and the build, beside the unit shards instead of in front
  # of them (they used to run serially before the tests in one job).
  static:
    name: Typecheck, lint, build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.static != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # No Supabase/Stripe env: every page falls back cleanly when nothing is
      # configured, and that is exactly what the build must prove.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.pipglyph.com

  # The unit suite, split over runners by vitest's own `--shard` (a hash of
  # each test file's path — no file list to maintain). In one job the coverage
  # run took 12 to 21 minutes (2026-10-12) and was cancelled at the limit
  # twice in a day with no test failing. A shard only RECORDS its coverage
  # (VITEST_COVERAGE_SHARD: no floors, no report — its share of the suite
  # could never meet them); the `coverage` job merges the shards' blobs and
  # enforces the floors of vitest.config.ts on the whole suite.
  # Six shards, measured (2026-10-12; the slowest shard's test step, across
  # runner types): three 7.4 min, four 6.2 to 9.5, six 5.6 to 7.7, eight 5.3.
  # The hash split is uneven — a handful of bake files are 40 % of the suite —
  # and a shard is never faster than its slowest FILE. One file was the floor:
  # the per-master art-window check, 5.5 to 7.5 min under coverage (50 s
  # without — V8's block counters in its pixel loops, which no coverage
  # `exclude` switches off). It now runs in four files
  # (tests/unit/render/art-window-masters.ts), and the title-room bakes, next
  # in line at 2.2 to 4.7 min, in four more
  # (tests/unit/render/title-room-scaled-pips.ts). Measured after (#525's
  # first four runs at six and its one at eight): six shards 4.1 to 4.7 min
  # at their slowest (the job 4.8 to 5.3), eight 4.2 (5.0) — no better: vitest's hash puts three of the heaviest
  # files left (mana-gem-parity, walker-saga-bake, edge-contract) in ONE of
  # eight. And eight shards start 15 jobs at once instead of 13 against the
  # account's 20 at a time, which runs beside other PRs' already wait on
  # (0 to 5 min for a runner, at six too). Six it stays. Today's floor is
  # walker-saga-bake or mana-gem-parity, 1.6 to 3.1 min each on one worker:
  # more shards pay off only once those are split — and a long file is split
  # as those two were, never by a list here.
  unit:
    name: Unit tests (${{ matrix.shard }}/${{ matrix.total }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
    runs-on: ubuntu-latest
    # A backstop for a hung run, not a budget.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        total: [6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Card Conjurer-derived frames live in the frames bucket, never in
      # git (docs/FRAMES.md): fetch every PNG in the frame manifest from
      # PRODUCTION's public bucket — sha256-checked against the manifest; the
      # dev bucket is asked only for a PR's frames not promoted yet — so the
      # tests that read bucket masters (the art-window coverage 7.6, the edge
      # contract 7.7, the square corners, the plate ink) run on them instead
      # of skipping. EVERY shard needs them: a suite gated on
      # `haveBucketMasters` skips silently without. Cached by the manifest's
      # hash (saved right after the fetch, so a red test run keeps it; by the
      # first shard only — one key, one writer); never committed (.gitignore).
      - name: Restore bucket frames
        id: frames-cache
        uses: actions/cache/restore@v4
        with:
          path: .frames-cache
          key: frames-${{ hashFiles('lib/frames/frame-manifest.json') }}
          restore-keys: frames-
      # A hung storage read fails this step in 10 min instead of eating the
      # job's 20 (fetchVerified retries each file 4× with a 60 s timeout).
      - name: Fetch bucket frames
        timeout-minutes: 10
        run: >-
          node scripts/frames-fetch.mjs --out .frames-cache
          --fallback-origin https://znipzaxgpaiandwiqabn.supabase.co/storage/v1/object/public/frames
      - name: Save bucket frames
        if: steps.frames-cache.outputs.cache-hit != 'true' && matrix.shard == 1
        uses: actions/cache/save@v4
        with:
          path: .frames-cache
          key: frames-${{ hashFiles('lib/frames/frame-manifest.json') }}
      - run: npm run test:coverage:shard -- --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          FRAMES_BUILD_DIR: .frames-cache
          VITEST_COVERAGE_SHARD: "1"
      # The shard's results and coverage (.vitest-reports/blob-<i>-<n>.json),
      # uploaded from a red shard too: the merge then reports its failures
      # beside the others'.
      - name: Upload the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest-reports/
          # The directory's name starts with a dot.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job replaces its attempt's report.
          overwrite: true

  # One report for the whole suite: every shard's tests replayed (a failure
  # in any of them fails this job too) and the merged coverage held to the
  # floors of vitest.config.ts — exactly what `npm run test:coverage` checks
  # on one machine.
  coverage:
    name: Unit coverage
    needs: [changes, unit]
    # Runs when a shard failed too, so the coverage report is still made —
    # and not at all in the notes and draft tiers (no shard ran: the floors
    # do not apply to a run of the two notes tests).
    if: ${{ !cancelled() && needs.changes.outputs.unit != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-blob-*
          merge-multiple: true
          path: .vitest-reports
      # Floors checked on five shards of six would be floors on other
      # numbers: every shard's blob must be here.
      - name: Every shard reported
        run: |
          ls -l .vitest-reports
          for i in 1 2 3 4 5 6; do test -s ".vitest-reports/blob-$i-6.json"; done
          test "$(ls .vitest-reports | wc -l)" -eq 6
      - run: npm run test:coverage:merge
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 3

  # The REQUIRED check (main's ruleset names "Typecheck, lint, unit"): green
  # only when the jobs its tier runs all are. `always()`, not `!cancelled()`:
  # the gate must RUN whatever became of the jobs it covers — failed, skipped,
  # timed out (a job stopped at its `timeout-minutes` ends as "cancelled") or
  # cancelled with the run — because a required check that is "skipped"
  # counts as passing, and `always()` is the one condition documented to run
  # in every one of those cases. It accepts exactly ONE shape per tier and
  # fails on anything else (`changes` must have succeeded in all of them):
  #
  #            static   unit+coverage  docs     frames, e2e, visual
  #   full     success  success        skipped  ran (not "skipped")
  #   light    success  success        skipped  skipped
  #   draft    success  skipped        success  skipped
  #   notes    skipped  skipped        success  skipped
  #
  # So "skipped" passes only where the classifier put it; a failed or
  # cancelled classifier, a skip nobody asked for, a failure, a cancel and a
  # timeout are all red. An unknown or empty tier is judged as full.
  #
  # It `needs` the other required jobs too (frames, e2e, visual) and so
  # finishes LAST. That, and the name below, is what keeps a pull request
  # closed between "ready for review" and the end of its full run: the draft
  # run left "skipped" — which satisfies a required check — on those three
  # names for the same commit, and GitHub reads the latest check of each
  # name. On a DRAFT this job therefore reports as "Draft checks", never
  # under the required name: the commit has no "Typecheck, lint, unit" at all
  # until a full (or notes) run has finished every job, by which time the
  # other names carry that run's own results. (A draft cannot be merged
  # anyway; this is about the minutes after it stops being one.)
  # Never rename the required name; a new job the check must cover joins
  # `needs` and the table.
  checks:
    name: ${{ needs.changes.outputs.tier == 'draft' && 'Draft checks (typecheck, lint, build)' || 'Typecheck, lint, unit' }}
    needs: [changes, static, unit, coverage, docs, frames, e2e, visual]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate
        env:
          NEEDS: ${{ toJSON(needs) }}
          TIER: ${{ needs.changes.outputs.tier }}
        run: |
          echo "tier: ${TIER:-(none: judged as full)}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -e --arg tier "$TIER" '
            ( if   $tier == "notes" then ["skipped", "skipped", "success", "skipped"]
              elif $tier == "draft" then ["success", "skipped", "success", "skipped"]
              elif $tier == "light" then ["success", "success", "skipped", "skipped"]
              else                       ["success", "success", "skipped", "ran"] end ) as $want
            | length == 8
            and .changes.result == "success"
            and .static.result == $want[0]
            and ([.unit, .coverage] | all(.result == $want[1]))
            and .docs.result == $want[2]
            and ([.frames, .e2e, .visual] | all(if $want[3] == "ran" then .result != "skipped" else .result == "skipped" end))
          ' > /dev/null

  frames:
    name: Frames published
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    # frames-check re-checks apparent misses one at a time with backoff
    # (transient storage errors are common when several PRs run at once).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/frames-check.mjs

  e2e:
    name: E2E (local Supabase)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      # Applies every migration + supabase/seed.sql + supabase/seeds/*.sql —
      # so this job also proves the whole chain builds from scratch.
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Write .env.e2e from the local stack
        run: |
          supabase status -o env > /tmp/stack.env
          get() { sed -n "s/^$1=\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" /tmp/stack.env; }
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(get PUBLISHABLE_KEY)"
            echo "SUPABASE_SECRET_KEY=$(get SECRET_KEY)"
            # The paid layer stays visible so the pricing specs run (no Stripe
            # keys needed to render the storefront).
            echo "NEXT_PUBLIC_BILLING_ENABLED=true"
            # The local stack's frames bucket is empty; frames that left git
            # (lib/frames/frame-manifest.json) load from the dev project's
            # public bucket, like every Vercel preview (docs/FRAMES.md).
            echo "NEXT_PUBLIC_FRAME_ORIGIN=https://znipzaxgpaiandwiqabn.supabase.co/storage/v1/object/public/frames"
            echo "SUPABASE_E2E_USER_EMAIL=e2e@pipglyph.test"
            echo "SUPABASE_E2E_USER_PASSWORD=ci-$(openssl rand -hex 12)"
          } > .env.e2e

      - name: Seed the e2e user
        run: node scripts/seed-e2e.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test --reporter=github,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json

      # Skips and retried-then-passed ("flaky") tests never fail the job, so
      # they hide — list them on the run summary instead.
      - name: Summarise skips and flakes
        if: ${{ !cancelled() }}
        run: node scripts/e2e-summary.mjs test-results/report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3

  visual-bake:
    name: Visual regression (bake ${{ matrix.group }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2]
    steps:
      # Depth 2 for --base HEAD^1: each case's scope is judged at the base
      # branch's layout version (the gate job reads the same commit).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The manifest's PNG objects (~140 MB), keyed by the manifest: storage
      # is read only when it changes (an older cache seeds the new one, and
      # the script drops objects the manifest no longer names). Every cached
      # file is re-checked against the manifest's sha256 before use, so a
      # cache written by another run can't feed the bake other bytes.
      - name: Restore the frame cache
        uses: actions/cache@v4
        with:
          path: tmp/visual/frames
          key: visual-frames-${{ hashFiles('lib/frames/frame-manifest.json') }}
          restore-keys: visual-frames-

      - name: Bake (4 of 12 shards)
        run: node scripts/visual-regression.mjs --shards 12 --group ${{ matrix.group }}/3 --no-gate --base HEAD^1

      - name: Upload the hashes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-results-${{ matrix.group }}
          path: |
            tmp/visual/results/
            tmp/visual/logs/
          retention-days: 3
          # A re-run of this job replaces its attempt's hashes.
          overwrite: true

  visual:
    name: Visual regression
    needs: [changes, visual-bake]
    # Runs (and fails) when a bake job failed too, so a failed bake never
    # leaves the check "skipped" — a skipped check counts as passing. It is
    # skipped on purpose, with the bakes, in every tier but the full one.
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Depth 2: HEAD^1 is the base branch's tip for a PR's merge commit and
      # the previous main for a push — "bumped" is judged against it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: visual-results-*
          merge-multiple: true
          path: tmp/visual
      - name: Gate
        run: node scripts/visual-regression.mjs --gate-only --shards 12 --base HEAD^1
      # What `npm run test:visual -- --update` would write, made on this
      # runner: `gh run download <run> -n visual-baseline -D tests/visual`.
      - name: Upload the regenerated baseline
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline
          path: tmp/visual/next/baseline.json
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  parity:
    name: Preview parity
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.heavy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The same frame cache as the visual jobs (the manifest's PNG objects,
      # sha-checked as they are read; never committed).
      - name: Restore the frame cache
        uses: actions/cache@v4
        with:
          path: tmp/visual/frames
          key: visual-frames-${{ hashFiles('lib/frames/frame-manifest.json') }}
          restore-keys: visual-frames-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Bake, then the preview in Chromium against its own dev server
      # (PARITY_HARNESS=1 — the only server /dev/parity is a route of). No
      # database, no secrets; nothing but the public frames bucket is read.
      - name: Compare the preview with the bake
        run: node scripts/parity.mjs

      # The case files `npm run test:parity -- --update` would write for
      # linux, made on this runner — only the ones that are new or moved,
      # and update.json naming them (a red run prints them as a script to
      # paste, and the command that fetches this). Nothing on a green run.
      - name: Upload the measured baseline
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-baseline
          path: tmp/parity/next/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: |
            tmp/parity/report.md
            tmp/parity/results/
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

      # A failing case's preview screenshot, bake and difference map.
      - name: Upload the differences
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-differences
          path: tmp/parity/out/
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
