<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">Two panels: a parasitic keyword whose cards only connect to each other, and an open keyword that connects to many ordinary cards</title>
  <rect width="1600" height="900" fill="#1a2030"/>
<text x="120" y="150" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="56" font-weight="600" fill="#f2f3f5" text-anchor="start">Parasitic or open?</text><text x="120" y="205" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="30" font-weight="400" fill="#9aa3b5" text-anchor="start">Does the keyword work with cards outside its own set?</text><rect x="120" y="260" width="640" height="520" rx="20" fill="#0d1320" stroke="#2a3346" stroke-width="3"/><text x="440" y="320" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="36" font-weight="600" fill="#8e72c9" text-anchor="middle">Parasitic</text><rect x="285" y="393" width="110" height="154" rx="5.0" fill="#1a2030" stroke="#8e72c9" stroke-width="5"/><rect x="292.7" y="400.7" width="94.6" height="12.32" rx="6" fill="none" stroke="#8e72c9" stroke-width="3" opacity="0.8"/><rect x="292.7" y="417.64" width="94.6" height="58.52" rx="4" fill="#1a2030" stroke="#8e72c9" stroke-width="2" opacity="0.8"/><rect x="292.7" y="480.78" width="94.6" height="10.780000000000001" rx="6" fill="none" stroke="#8e72c9" stroke-width="3" opacity="0.8"/><rect x="292.7" y="496.18" width="94.6" height="38.5" rx="4" fill="none" stroke="#8e72c9" stroke-width="2" opacity="0.8"/><rect x="485" y="393" width="110" height="154" rx="5.0" fill="#1a2030" stroke="#8e72c9" stroke-width="5"/><rect x="492.7" y="400.7" width="94.6" height="12.32" rx="6" fill="none" stroke="#8e72c9" stroke-width="3" opacity="0.8"/><rect x="492.7" y="417.64" width="94.6" height="58.52" rx="4" fill="#1a2030" stroke="#8e72c9" stroke-width="2" opacity="0.8"/><rect x="492.7" y="480.78" width="94.6" height="10.780000000000001" rx="6" fill="none" stroke="#8e72c9" stroke-width="3" opacity="0.8"/><rect x="492.7" y="496.18" width="94.6" height="38.5" rx="4" fill="none" stroke="#8e72c9" stroke-width="2" opacity="0.8"/><rect x="385" y="553" width="110" height="154" rx="5.0" fill="#1a2030" stroke="#8e72c9"