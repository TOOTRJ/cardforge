<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">A rules line for an invented keyword, Waymark 2, with callouts for its name, its number parameter and its italic reminder text</title>
  <rect width="1600" height="900" fill="#1a2030"/>
<text x="120" y="165" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="60" font-weight="600" fill="#f2f3f5" text-anchor="start">Anatomy of a keyword line</text><text x="120" y="222" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="30" font-weight="400" fill="#9aa3b5" text-anchor="start">An invented keyword, written the way the rules print one</text><rect x="120" y="320" width="1360" height="200" rx="18" fill="#0d1320" stroke="#2a3346" stroke-width="3"/><text x="160" y="400" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="44" font-weight="700" fill="#f2f3f5" text-anchor="start">Waymark 2</text><text x="390" y="400" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="36" font-weight="400" fill="#9aa3b5" text-anchor="start" font-style="italic">(When this creature enters, put two waymark counters</text><text x="160" y="460" font-family="Georgia, &#x27;Times New Roman&#x27;, serif" font-size="36" font-weight="400" fill="#9aa3b5" text-anchor="start" font-style="italic">on a land you control. That land has “{T}: Add one mana of any color.”)</text><path d="M250 520 V 580 H 170" fill="none" stroke="#d8b26e" stroke-width="4"/><circle cx="250" cy="520" r="8" fill="#d8b26e"/><line x1="170" y1="580" x2="170" y2="612" stroke="#d8b26e" stroke-width="4"/><text x="160" y="655" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="34" font-weight="600" fill="#d8b26e" text-anchor="start">Name</text><text x="160" y="700" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="26" font-weight="400" fill="#9aa3b5" text-anchor="start">one evocative word</text><path d="M370 520 V 580 H 570" fill="none" stroke="#8e72c9" stroke-width="4"/><circle cx="370" cy="520" r="8" fill="#8e72c9"/><line x1="570" y1="580" x2="570" y2="612" stroke="#8e72c9" stroke-width="4"/><text x="560" y="655" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="34" font-weight="600" fill="#8e72c9" text-anchor="start">Parameter</text><text x="560" y="700" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="26" font-weight="400" fill="#9aa3b5" text-anchor="start">N scales the effect</text><path d="M800 520 V 580 H 970" fill="none" stroke="#b794e6" stroke-width="4"/><circle cx="800" cy="520" r="8" fill="#b794e6"/><line x1="970" y1="580" x2="970" y2="612" stroke="#b794e6" stroke-width="4"/><text x="960" y="655" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="34" font-weight="600" fill="#b794e6" text-anchor="start">Reminder text</text><text x="960" y="700" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="26" font-weight="400" fill="#9aa3b5" text-anchor="start">italic, in parentheses</text>
</svg>
