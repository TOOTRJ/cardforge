<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">A release timeline: drafts feed a queue of scheduled articles that go live one at a time</title>
  <rect width="1600" height="900" fill="#14121c"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ece6f5">
    <text x="120" y="150" font-size="56">The article backlog</text>
    <text x="120" y="210" font-size="28" fill="#a89fbf">Draft → scheduled → live, one release at a time</text>
  </g>
  <line x1="160" y1="520" x2="1440" y2="520" stroke="#5b4f78" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-size="26" text-anchor="middle">
    <circle cx="300" cy="520" r="44" fill="#2a2440" stroke="#a89fbf" stroke-width="4"/>
    <text x="300" y="620" fill="#a89fbf">Draft</text>
    <circle cx="640" cy="520" r="44" fill="#3a2f12" stroke="#d9b45a" stroke-width="4"/>
    <text x="640" y="620" fill="#d9b45a">Scheduled</text>
    <circle cx="980" cy="520" r="44" fill="#3a2f12" stroke="#d9b45a" stroke-width="4"/>
    <text x="980" y="620" fill="#d9b45a">Scheduled</text>
    <circle cx="1320" cy="520" r="44" fill="#16352a" stroke="#6fcf97" stroke-width="4"/>
    <text x="1320" y="620" fill="#6fcf97">Live</text>
  </g>
</svg>
