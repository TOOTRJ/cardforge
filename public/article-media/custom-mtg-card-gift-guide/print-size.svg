<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">A card drawn at 2.5 by 3.5 inches with its trim line dashed and a one-eighth-inch bleed shown around the edge for print shops</title>
  <rect width="1600" height="900" fill="#1a2030"/>
<text x="120" y="150" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="54" font-weight="600" fill="#f2f3f5" text-anchor="start">Printing at real card size</text><text x="120" y="205" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="30" font-weight="400" fill="#9aa3b5" text-anchor="start">A Magic card is 2.5 × 3.5 inches (63 × 88 mm). Print at 100%.</text><rect x="513" y="233" width="370" height="504" fill="#6b4d9a" opacity="0.45"/><rect x="530" y="250" width="336" height="470" rx="15.1" fill="#0d1320" stroke="#d8b26e" stroke-width="5"/><rect x="553.52" y="273.52" width="288.96" height="37.6" rx="6" fill="none" stroke="#d8b26e" stroke-width="3" opacity="0.8"/><rect x="553.52" y="325.21999999999997" width="288.96" height="178.6" rx="4" fill="#1a2030" stroke="#d8b26e" stroke-width="2" opacity="0.8"/><rect x="553.52" y="517.92" width="288.96" height="32.900000000000006" rx="6" fill="none" stroke="#d8b26e" stroke-width="3" opacity="0.8"/><rect x="553.52" y="564.92" width="288.96" height="117.5" rx="4" fill="none" stroke="#d8b26e" stroke-width="2" opacity="0.8"/><rect x="530" y="250" width="336" height="470" fill="none" stroke="#f2f3f5" stroke-width="2" stroke-dasharray="10 8"/><line x1="530" y1="765" x2="866" y2="765" stroke="#9aa3b5" stroke-width="3"/><text x="698.0" y="802" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#9aa3b5" text-anchor="middle">2.5 in (63 mm)</text><line x1="460" y1="250" x2="460" y2="720" stroke="#9aa3b5" stroke-width="3"/><g transform="rotate(-90 430 485.0)"><text x="430" y="485.0" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#9aa3b5" text-anchor="middle">3.5 in (88 mm)</text></g><text x="1000" y="330" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#f2f3f5" text-anchor="start">Dashed line: the trim</text><text x="1000" y="380" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#8e72c9" text-anchor="start">Purple edge: a 1/8 in bleed</text><text x="1000" y="430" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#9aa3b5" text-anchor="start">for print shops, cut away</text><text x="1000" y="520" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#f2f3f5" text-anchor="start">Home printer: no bleed needed;</text><text x="1000" y="570" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#9aa3b5" text-anchor="start">turn “fit to page” off and</text><text x="1000" y="620" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#9aa3b5" text-anchor="start">measure the first card.</text>
</svg>
