  <title id="t">A custom card wrapped with a ribbon and a gift tag that reads for you, with Your friend here in its title bar</title>
  <rect width="1600" height="900" fill="#1a2030"/>
<text x="120" y="165" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="60" font-weight="600" fill="#f2f3f5" text-anchor="start">A card made for one person</text><text x="120" y="222" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="30" font-weight="400" fill="#9aa3b5" text-anchor="start">Their name in the title bar, their story in the rules</text><rect x="640" y="270" width="320" height="448" rx="14.4" fill="#0d1320" stroke="#d8b26e" stroke-width="5"/><rect x="662.4" y="292.4" width="275.2" height="35.84" rx="6" fill="none" stroke="#d8b26e" stroke-width="3" opacity="0.8"/><rect x="662.4" y="341.67999999999995" width="275.2" height="170.24" rx="4" fill="#1a2030" stroke="#d8b26e" stroke-width="2" opacity="0.8"/><rect x="662.4" y="525.36" width="275.2" height="31.360000000000003" rx="6" fill="none" stroke="#d8b26e" stroke-width="3" opacity="0.8"/><rect x="662.4" y="570.16" width="275.2" height="112.0" rx="4" fill="none" stroke="#d8b26e" stroke-width="2" opacity="0.8"/><text x="800" y="319" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="600" fill="#f2f3f5" text-anchor="middle">Your friend here</text><path d="M600 520 L1000 520" stroke="#8e72c9" stroke-width="22"/><path d="M800 520 C 740 450, 700 470, 720 520 C 700 570, 740 590, 800 520 C 860 450, 900 470, 880 520 C 900 570, 860 590, 800 520 Z" fill="#6b4d9a" stroke="#8e72c9" stroke-width="4"/><path d="M1120 360 L1360 360 L1420 420 L1360 480 L1120 480 Z" fill="#0d1320" stroke="#d8b26e" stroke-width="4"/><circle cx="1350" cy="420" r="10" fill="#d8b26e"/><text x="1140" y="432" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="36" font-weight="600" fill="#d8b26e" text-anchor="start">for you</text><path d="M1120 420 C 1060 430, 1020 470, 1000 520" stroke="#d8b26e" stroke-width="3" fill="none"/>
