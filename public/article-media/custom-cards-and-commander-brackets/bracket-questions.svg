<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">A flow of four yes-or-no questions for placing a custom card in a Commander bracket, each yes pointing to a higher bracket</title>
  <rect width="1600" height="900" fill="#1a2030"/>
<text x="120" y="150" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="50" font-weight="600" fill="#f2f3f5" text-anchor="start">Placing a custom card: four questions</text><rect x="120" y="195" width="880" height="112" rx="16" fill="#0d1320" stroke="#8e72c9" stroke-width="3"/><text x="150" y="261" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#f2f3f5" text-anchor="start">Does it destroy or lock down every player&#x27;s lands?</text><line x1="1000" y1="251" x2="1080" y2="251" stroke="#d8b26e" stroke-width="4"/><text x="1040" y="239" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="22" font-weight="400" fill="#d8b26e" text-anchor="middle">yes</text><rect x="1080" y="211" width="400" height="80" rx="40" fill="#0d1320" stroke="#d8b26e" stroke-width="3"/><text x="1280" y="260" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="25" font-weight="600" fill="#d8b26e" text-anchor="middle">Bracket 4 or 5</text><line x1="560" y1="307" x2="560" y2="335" stroke="#9aa3b5" stroke-width="3"/><text x="585" y="329" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="22" font-weight="400" fill="#9aa3b5" text-anchor="start">no</text><rect x="120" y="335" width="880" height="112" rx="16" fill="#0d1320" stroke="#8e72c9" stroke-width="3"/><text x="150" y="383" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#f2f3f5" text-anchor="start">Does it take extra turns again and again, or win</text><text x="150" y="423" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#f2f3f5" text-anchor="start">with just one other card?</text><line x1="1000" y1="391" x2="1080" y2="391" stroke="#d8b26e" stroke-width="4"/><text x="1040" y="379" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="22" font-weight="400" fill="#d8b26e" text-anchor="middle">yes</text><rect x="1080" y="351" width="400" height="80" rx="40" fill="#0d1320" stroke="#d8b26e" stroke-width="3"/><text x="1280" y="400" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="25" font-weight="600" fill="#d8b26e" text-anchor="middle">Bracket 4 or 5</text><line x1="560" y1="447" x2="560" y2="475" stroke="#9aa3b5" stroke-width="3"/><text x="585" y="469" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="22" font-weight="400" fill="#9aa3b5" text-anchor="start">no</text><rect x="120" y="475" width="880" height="112" rx="16" fill="#0d1320" stroke="#8e72c9" stroke-width="3"/><text x="150" y="523" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#f2f3f5" text-anchor="start">Would it go in nearly every deck of its colors, at</text><text x="150" y="563" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#f2f3f5" text-anchor="start">almost any power level?</text><line x1="1000" y1="531" x2="1080" y2="531" stroke="#d8b26e" stroke-width="4"/><text x="1040" y="519" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="22" font-weight="400" fill="#d8b26e" text-anchor="middle">yes</text><rect x="1080" y="491" width="400" height="80" rx="40" fill="#0d1320" stroke="#d8b26e" stroke-width="3"/><text x="1280" y="540" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="25" font-weight="600" fill="#d8b26e" text-anchor="middle">Count it as a Game Changer</text><line x1="560" y1="587" x2="560" y2="615" stroke="#9aa3b5" stroke-width="3"/><text x="585" y="609" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="22" font-weight="400" fill="#9aa3b5" text-anchor="start">no</text><rect x="120" y="615" width="880" height="112" rx="16" fill="#0d1320" stroke="#8e72c9" stroke-width="3"/><text x="150" y="663" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#f2f3f5" text-anchor="start">Does it find a specific card from your library for</text><text x="150" y="703" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#f2f3f5" text-anchor="start">little mana?</text><line x1="1000" y1="671" x2="1080" y2="671" stroke="#d8b26e" stroke-width="4"/><text x="1040" y="659" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="22" font-weight="400" fill="#d8b26e" text-anchor="middle">yes</text><rect x="1080" y="631" width="400" height="80" rx="40" fill="#0d1320" stroke="#d8b26e" stroke-width="3"/><text x="1280" y="680" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="25" font-weight="600" fill="#d8b26e" text-anchor="middle">Watch your tutor count</text><text x="120" y="795" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="24" font-weight="400" fill="#9aa3b5" text-anchor="start">All four “no”: it likely fits brackets 1–2. A rule of thumb — check the current official guide.</text>
</svg>
