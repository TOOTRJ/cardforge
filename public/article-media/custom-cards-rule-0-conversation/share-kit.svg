<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">A four-item checklist: links to the custom cards, the decklist, a one-line pitch with the bracket, and the real cards kept as a fallback</title>
  <rect width="1600" height="900" fill="#1a2030"/>
<text x="120" y="160" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="52" font-weight="600" fill="#f2f3f5" text-anchor="start">What to send before game night</text><circle cx="170" cy="280" r="38" fill="#0d1320" stroke="#d8b26e" stroke-width="4"/><text x="170" y="294" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="38" font-weight="600" fill="#d8b26e" text-anchor="middle">1</text><text x="240" y="272" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="34" font-weight="600" fill="#f2f3f5" text-anchor="start">A link to every custom card</text><text x="240" y="316" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#9aa3b5" text-anchor="start">Public or unlisted card pages they can open on a phone</text><circle cx="170" cy="425" r="38" fill="#0d1320" stroke="#d8b26e" stroke-width="4"/><text x="170" y="439" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="38" font-weight="600" fill="#d8b26e" text-anchor="middle">2</text><text x="240" y="417" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="34" font-weight="600" fill="#f2f3f5" text-anchor="start">The decklist</text><text x="240" y="461" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#9aa3b5" text-anchor="start">So they see what the card sits beside, not just the card</text><circle cx="170" cy="570" r="38" fill="#0d1320" stroke="#d8b26e" stroke-width="4"/><text x="170" y="584" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="38" font-weight="600" fill="#d8b26e" text-anchor="middle">3</text><text x="240" y="562" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="34" font-weight="600" fill="#f2f3f5" text-anchor="start">A one-line pitch</text><text x="240" y="606" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#9aa3b5" text-anchor="start">What the deck wants to do, and its bracket</text><circle cx="170" cy="715" r="38" fill="#0d1320" stroke="#d8b26e" stroke-width="4"/><text x="170" y="729" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="38" font-weight="600" fill="#d8b26e" text-anchor="middle">4</text><text x="240" y="707" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="34" font-weight="600" fill="#f2f3f5" text-anchor="start">A fallback</text><text x="240" y="751" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="28" font-weight="400" fill="#9aa3b5" text-anchor="start">The real cards you will play instead if anyone says no</text>
</svg>
