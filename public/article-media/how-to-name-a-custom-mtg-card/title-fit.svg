<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
  <title id="t">Three title bars: a short name at full size, a long name set smaller beside a three-pip mana cost, and an over-long name cut with an ellipsis</title>
  <rect width="1600" height="900" fill="#1a2030"/>
<text x="120" y="150" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="54" font-weight="600" fill="#f2f3f5" text-anchor="start">How a long name fits the title bar</text><rect x="120" y="230" width="1360" height="110" rx="20" fill="#0d1320" stroke="#d8b26e" stroke-width="3"/><text x="160" y="300" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="44" font-weight="600" fill="#f2f3f5" text-anchor="start">Hollowmere Crossing</text><circle cx="1430" cy="285" r="24" fill="#1a2030" stroke="#9aa3b5" stroke-width="2"/><circle cx="1372" cy="285" r="24" fill="#1a2030" stroke="#9aa3b5" stroke-width="2"/><circle cx="1314" cy="285" r="24" fill="#1a2030" stroke="#9aa3b5" stroke-width="2"/><text x="160" y="380" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="26" font-weight="400" fill="#d8b26e" text-anchor="start">fits at full size</text><rect x="120" y="430" width="1360" height="110" rx="20" fill="#0d1320" stroke="#8e72c9" stroke-width="3"/><text x="160" y="500" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="30" font-weight="600" fill="#f2f3f5" text-anchor="start">Wren Ashvale, Lantern Keeper of the Drowned Archive at Hollowmere</text><circle cx="1430" cy="485" r="24" fill="#1a2030" stroke="#9aa3b5" stroke-width="2"/><circle cx="1372" cy="485" r="24" fill="#1a2030" stroke="#9aa3b5" stroke-width="2"/><circle cx="1314" cy="485" r="24" fill="#1a2030" stroke="#9aa3b5" stroke-width="2"/><text x="160" y="580" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="26" font-weight="400" fill="#8e72c9" text-anchor="start">shrinks to fit beside the cost</text><rect x="120" y="630" width="1360" height="110" rx="20" fill="#0d1320" stroke="#9aa3b5" stroke-width="3"/><text x="160" y="700" font-family="Cinzel, Georgia, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="600" fill="#f2f3f5" text-anchor="start">Wren Ashvale, Lantern Keeper of the Drowned Archive at Hollowmere and the Seven Bells of …</text><circle cx="1430" cy="685" r="24" fill="#1a2030" stroke="#9aa3b5" stroke-width="2"/><circle cx="1372" cy="685" r="24" fill="#1a2030" stroke="#9aa3b5" stroke-width="2"/><circle cx="1314" cy="685" r="24" fill="#1a2030" stroke="#9aa3b5" stroke-width="2"/><text x="160" y="780" font-family="Geist, system-ui, -apple-system, &#x27;Segoe UI&#x27;, sans-serif" font-size="26" font-weight="400" fill="#9aa3b5" text-anchor="start">past the smallest size: cut with “…”</text>
</svg>
